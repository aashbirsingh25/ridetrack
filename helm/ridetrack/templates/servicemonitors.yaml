apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ridetrack.fullname" . }}-servicemonitor
  labels:
    release: monitoring
    {{- include "ridetrack.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ridetrack
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
