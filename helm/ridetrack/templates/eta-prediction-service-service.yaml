{{- if .Values.etaPredictionService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: eta-prediction-service
  labels:
    app.kubernetes.io/component: eta-prediction-service
    {{- include "ridetrack.labels" . | nindent 4 }}
spec:
  type: {{ .Values.etaPredictionService.service.type }}
  ports:
    - port: {{ .Values.etaPredictionService.service.port }}
      targetPort: {{ .Values.etaPredictionService.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: eta-prediction-service
    {{- include "ridetrack.selectorLabels" . | nindent 4 }}
{{- end }}
