{{- if .Values.riderDispatchService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rider-dispatch-service
  labels:
    app.kubernetes.io/component: rider-dispatch-service
    {{- include "ridetrack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.riderDispatchService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: rider-dispatch-service
      {{- include "ridetrack.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: rider-dispatch-service
        {{- include "ridetrack.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: rider-dispatch-service
          image: "{{ .Values.riderDispatchService.image.repository }}:{{ .Values.riderDispatchService.image.tag }}"
          imagePullPolicy: {{ .Values.riderDispatchService.image.pullPolicy | default .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.riderDispatchService.service.port }}
              protocol: TCP
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "ridetrack.fullname" . }}-config
                  key: RIDER_DISPATCH_SERVICE_PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ridetrack.fullname" . }}-secret
                  key: DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "ridetrack.fullname" . }}-secret
                  key: RABBITMQ_URL
          resources:
            {{- toYaml .Values.riderDispatchService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.riderDispatchService.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.riderDispatchService.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.riderDispatchService.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.riderDispatchService.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.riderDispatchService.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.riderDispatchService.probes.readiness.periodSeconds }}
{{- end }}
