{{- if .Values.liveTrackingService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: live-tracking-service
  labels:
    app.kubernetes.io/component: live-tracking-service
    {{- include "ridetrack.labels" . | nindent 4 }}
spec:
  type: {{ .Values.liveTrackingService.service.type }}
  ports:
    - port: {{ .Values.liveTrackingService.service.port }}
      targetPort: {{ .Values.liveTrackingService.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: live-tracking-service
    {{- include "ridetrack.selectorLabels" . | nindent 4 }}
{{- end }}
