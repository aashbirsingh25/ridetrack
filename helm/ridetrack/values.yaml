# Default values for RideTrack Helm Chart
# This is a YAML-formatted file.

global:
  environment: local-minikube
  imagePullPolicy: IfNotPresent

# ==============================================================================
# Microservices Configuration
# ==============================================================================

# 1. Delivery Order Service (NestJS REST API + MongoDB + RabbitMQ)
deliveryOrderService:
  enabled: true
  replicaCount: 1
  image:
    repository: delivery-order-service
    tag: v3
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  env:
    PORT: "3000"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    liveness:
      path: /orders
      initialDelaySeconds: 15
      periodSeconds: 10
    readiness:
      path: /orders
      initialDelaySeconds: 10
      periodSeconds: 5

# 2. Rider Dispatch Service (NestJS REST API + PostgreSQL + RabbitMQ)
riderDispatchService:
  enabled: true
  replicaCount: 1
  image:
    repository: rider-dispatch-service
    tag: v3
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3001
    targetPort: 3001
  env:
    PORT: "3001"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    liveness:
      path: /riders
      initialDelaySeconds: 15
      periodSeconds: 10
    readiness:
      path: /riders
      initialDelaySeconds: 10
      periodSeconds: 5

# 3. Live Tracking Service (NestJS Socket.io WebSockets + Redis)
liveTrackingService:
  enabled: true
  replicaCount: 1
  image:
    repository: live-tracking-service
    tag: v4
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3002
    targetPort: 3002
  env:
    PORT: "3002"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    liveness:
      path: /tracking
      initialDelaySeconds: 15
      periodSeconds: 10
    readiness:
      path: /tracking
      initialDelaySeconds: 10
      periodSeconds: 5

# 4. ETA Prediction Service (Python FastAPI ML Model)
etaPredictionService:
  enabled: true
  replicaCount: 1
  image:
    repository: eta-prediction-service
    tag: v2
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3004
    targetPort: 3004
  env:
    PORT: "3004"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 10
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 5

# 5. RideTrack Frontend (Next.js 14 Web Application)
ridetrackFrontend:
  enabled: true
  replicaCount: 1
  image:
    repository: ridetrack-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 3003
    targetPort: 3003
    nodePort: 30003
  env:
    PORT: "3003"
    NEXT_PUBLIC_ORDER_SERVICE_URL: "http://delivery-order-service:3000"
    NEXT_PUBLIC_RIDER_SERVICE_URL: "http://rider-dispatch-service:3001"
    NEXT_PUBLIC_TRACKING_SERVICE_URL: "http://live-tracking-service:3002"
    NEXT_PUBLIC_ETA_SERVICE_URL: "http://eta-prediction-service:3004"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    liveness:
      path: /
      initialDelaySeconds: 15
      periodSeconds: 10
    readiness:
      path: /
      initialDelaySeconds: 10
      periodSeconds: 5

# ==============================================================================
# Secrets & External Datastores Configuration
# Pass actual credentials via helm -f values-secrets.yaml (gitignored)
# ==============================================================================

secrets:
  mongodbUri: "" # Provide via values-secrets.yaml or --set secrets.mongodbUri=...
  databaseUrl: "" # Provide via values-secrets.yaml or --set secrets.databaseUrl=...
  rabbitmqUrl: "" # Provide via values-secrets.yaml or --set secrets.rabbitmqUrl=...
  redisUrl: "" # Provide via values-secrets.yaml or --set secrets.redisUrl=...

